/* ==========================================================
   V20 — CLOUD SYNC
   ========================================================== */
.cloud-status{
  appearance:none!important;
  border:1px solid transparent!important;
  background:transparent!important;
  display:inline-flex!important;
  align-items:center;
  gap:6px;
  min-height:34px;
  padding:7px 9px!important;
  border-radius:10px!important;
  color:#75869d!important;
  font:inherit!important;
  cursor:pointer;
}
.cloud-status:hover{background:#101c2e!important;border-color:#24354d!important}
.cloud-status .cloud-status-dot{font-size:10px;color:#67798f}
.cloud-status b{font-size:11px;font-weight:800}
.cloud-status.synced{color:#a9c9bb!important}.cloud-status.synced .cloud-status-dot{color:#58d69d}
.cloud-status.syncing{color:#a9b9cf!important}.cloud-status.syncing .cloud-status-dot{color:#7394ff;animation:cloudPulse 1s infinite}
.cloud-status.pending{color:#d6b982!important}.cloud-status.pending .cloud-status-dot{color:#f0b765}
.cloud-status.offline{color:#9ba7b8!important}.cloud-status.offline .cloud-status-dot{color:#8a98aa}
.cloud-status.error{color:#ff9aac!important}.cloud-status.error .cloud-status-dot{color:#ff7389}
.cloud-status.signedout .cloud-status-dot,.cloud-status.local .cloud-status-dot{color:#6d7f95}
@keyframes cloudPulse{50%{opacity:.3}}

.cloud-backdrop{
  position:fixed;inset:0;z-index:500;
  display:grid;place-items:center;
  padding:20px;
  background:rgba(3,8,16,.76);
  backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;
  transition:opacity .14s ease;
}
.cloud-backdrop.open{opacity:1;pointer-events:auto}
.cloud-panel{
  width:min(720px,100%);
  max-height:min(88vh,820px);
  overflow:auto;
  border:1px solid #2b3d58;
  border-radius:20px;
  background:#0b1625;
  color:#edf3fa;
  box-shadow:0 34px 90px rgba(0,0,0,.48);
}
.cloud-panel-head{
  position:sticky;top:0;z-index:2;
  display:flex;justify-content:space-between;gap:18px;align-items:flex-start;
  padding:20px 22px 17px;
  border-bottom:1px solid #1d2b40;
  background:rgba(11,22,37,.96);
  backdrop-filter:blur(8px);
}
.cloud-panel-head>div>span{
  display:block;color:#7394ff;font-size:11px;font-weight:900;letter-spacing:.11em
}
.cloud-panel-head h2{margin:4px 0 3px;font-size:23px;line-height:1.15}
.cloud-panel-head p{margin:0;color:#899bb2;font-size:13px;line-height:1.4}
.cloud-panel-head>button{
  width:38px;height:38px;border:1px solid #263851;border-radius:10px;
  background:#101d30;color:#91a2b9;font-size:24px;line-height:1;cursor:pointer
}
.cloud-section{padding:18px 22px;border-bottom:1px solid #1a293e}
.cloud-section h3{margin:0 0 4px;font-size:16px}
.cloud-section p{margin:0;color:#7f91a8;font-size:12.5px;line-height:1.45}
.cloud-section-head,.cloud-account{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px
}
.cloud-section-head p{font-size:11.5px;word-break:break-all}
.cloud-link{
  appearance:none;border:0;background:transparent;color:#8da9ff;
  font-size:12px;font-weight:800;cursor:pointer;padding:4px
}
.cloud-config-block,.cloud-login-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cloud-config-block label:first-child{grid-column:1/3}
.cloud-config-block label,.cloud-login-grid label{
  color:#8fa0b7;font-size:12px;font-weight:800
}
.cloud-config-block input,.cloud-login-grid input{
  width:100%;margin-top:5px;min-height:44px;padding:10px 11px;
  border:1px solid #2a3d58;border-radius:10px;
  background:#081321;color:#edf3fa;font-size:14px
}
.cloud-config-block .cloud-inline-actions{grid-column:1/3}
.cloud-config-block p{grid-column:1/3}
.cloud-inline-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cloud-login-btn{margin-top:12px!important}
.cloud-account>div{display:flex;align-items:center;gap:9px}
.cloud-account-dot{width:10px;height:10px;border-radius:50%;background:#58d69d;box-shadow:0 0 0 4px rgba(88,214,157,.08)}
.cloud-account strong{display:block;font-size:14px}
.cloud-account small{display:block;margin-top:2px;color:#71849b;font-size:11px;word-break:break-all}
.cloud-status-card{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px
}
.cloud-status-card>div{
  padding:11px;border:1px solid #1e3048;border-radius:11px;background:#0d192a
}
.cloud-status-card span{display:block;color:#71839a;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.cloud-status-card strong{display:block;margin-top:4px;color:#e8eef6;font-size:13px}
.cloud-error,.cloud-conflict{
  margin:16px 22px 0;padding:13px 14px;border-radius:12px
}
.cloud-error{
  border:1px solid rgba(255,115,137,.30);
  background:rgba(255,115,137,.07);color:#ff9bae;font-size:12.5px
}
.cloud-conflict{
  border:1px solid rgba(240,183,101,.34);
  background:rgba(240,183,101,.065)
}
.cloud-conflict>span{display:block;color:#f0b765;font-size:10.5px;font-weight:900;letter-spacing:.08em}
.cloud-conflict>strong{display:block;margin-top:4px;font-size:15px}
.cloud-conflict>p{margin:4px 0 11px;color:#a99880;font-size:12px}
.cloud-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cloud-choice-grid button{
  padding:12px;border:1px solid #34465f;border-radius:11px;
  background:#101d30;color:#dce5f0;text-align:left;cursor:pointer
}
.cloud-choice-grid button:hover{border-color:#647ea4;background:#15263b}
.cloud-choice-grid b{display:block;font-size:13px}
.cloud-choice-grid small{display:block;margin-top:3px;color:#8193aa;font-size:11px;line-height:1.35}
.cloud-version-list{display:grid;gap:6px;margin-top:10px}
.cloud-version-list button{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:9px 10px;border:1px solid #1f3047;border-radius:10px;
  background:#0d1929;color:#dbe4ef;text-align:left;cursor:pointer
}
.cloud-version-list button:hover{border-color:#3b526f;background:#112036}
.cloud-version-list strong{display:block;font-size:12.5px}
.cloud-version-list small{display:block;margin-top:2px;color:#74869d;font-size:11px}
.cloud-version-list button>b{color:#8da9ff;font-size:11px}
.cloud-no-versions{
  margin-top:10px;padding:12px;border:1px dashed #294057;border-radius:10px;
  color:#71849b;font-size:12px;text-align:center
}
.cloud-local-note{background:rgba(88,214,157,.018)}
@media(max-width:700px){
  .cloud-backdrop{padding:10px}
  .cloud-panel{max-height:92vh}
  .cloud-panel-head,.cloud-section{padding-left:15px;padding-right:15px}
  .cloud-config-block,.cloud-login-grid,.cloud-status-card,.cloud-choice-grid{grid-template-columns:1fr}
  .cloud-config-block label:first-child,.cloud-config-block .cloud-inline-actions,.cloud-config-block p{grid-column:1}
  .cloud-status{padding:6px!important}
  .cloud-status b{display:none}
}
@media(prefers-reduced-motion:reduce){.cloud-status.syncing .cloud-status-dot{animation:none}}

.school-class-chip.chip-np{
  background:rgba(102,190,210,.10)!important;
  border:1px dashed rgba(102,190,210,.34)!important;
  color:#9edce9!important;
}
.school-calendar-legend i.np{
  background:#66bed2;
  box-shadow:0 0 0 1px rgba(102,190,210,.18);
}
.seven-day-load .np{
  color:#9edce9!important;
  background:rgba(102,190,210,.09)!important;
  border:1px dashed rgba(102,190,210,.20);
}
.work-row .work-date span{
  white-space:nowrap;
}

\n/* V25 — SGE: cards sem informação redundante */\nbody.design-v19 .work-subject-top{display:grid!important;grid-template-columns:42px minmax(0,1fr)!important;gap:12px!important;align-items:center!important}\nbody.design-v19 .work-badge.work-badge-icon-only{width:42px!important;height:42px!important;min-width:42px!important;min-height:42px!important;display:grid!important;place-items:center!important;padding:0!important;margin:0!important;border-radius:11px!important;background:rgba(115,148,255,.055)!important}\nbody.design-v19 .work-badge.work-badge-icon-only.mat{background:rgba(86,214,158,.055)!important}\nbody.design-v19 .work-badge.work-badge-icon-only.exp{background:rgba(170,137,255,.06)!important}\nbody.design-v19 .work-badge-icon{width:28px!important;height:28px!important;object-fit:contain!important;display:block!important}\nbody.design-v19 .work-subject-top>strong{font-size:16px!important;line-height:1.25!important;font-weight:850!important;letter-spacing:-.01em!important}\nbody.design-v19 .work-subject>span{margin-top:5px!important;font-size:12.5px!important;line-height:1.3!important;color:#8193aa!important}\nbody.design-v19 .work-date strong{font-size:14.5px!important}\nbody.design-v19 .work-date span{margin-top:4px!important;font-size:12.5px!important}\nbody.design-v19.density-compact .work-subject-top{grid-template-columns:34px minmax(0,1fr)!important;gap:9px!important}\nbody.design-v19.density-compact .work-badge.work-badge-icon-only{width:34px!important;height:34px!important;min-width:34px!important;min-height:34px!important}\nbody.design-v19.density-compact .work-badge-icon{width:23px!important;height:23px!important}\nbody.design-v19.density-compact .work-subject>span{display:block!important;font-size:12px!important}\n

/* ==========================================================
   V26 — Registro de erros do SGE mais seguro
   ========================================================== */
body.design-v19 .sge-issue-editor label small.sge-issue-day-hint{
  display:block;
  margin-top:5px;
  color:#71859d;
  font-size:12px!important;
  line-height:1.3;
  font-weight:700;
}
body.design-v19 .sge-issue-editor select:disabled{
  opacity:.55;
  cursor:not-allowed;
}
body.design-v19 .sge-issue-editor .btn:disabled{
  opacity:.42;
  cursor:not-allowed;
  pointer-events:none;
}
body.design-v19 .sge-issue-duplicate-warning{
  display:none;
  grid-column:1/-1;
  padding:10px 12px;
  border:1px solid rgba(240,183,101,.30);
  border-radius:10px;
  background:rgba(240,183,101,.07);
  color:#d9b97d;
  font-size:12.5px;
  line-height:1.4;
}
body.design-v19 .sge-issue-duplicate-warning.show{display:block}
body.design-v19 .sge-issue-duplicate-warning b{color:#f0c477}


/* ==========================================================
   V27 — Projeto Integrador II: Ementa = obrigação semestral
   ========================================================== */
body.design-v19 #sec-planejamentos .module-task-card.mat .module-task-main small{
  color:#8fa59c!important;
}
body.design-v19 #sec-planejamentos .module-summary-card.mat{
  box-shadow:inset 3px 0 0 rgba(86,214,158,.48)!important;
}


/* ===== V29 ===== */
.today-flow-head h2{text-transform:none!important}
.seven-day .load-alert{position:static!important;display:block!important;margin-top:8px!important;inset:auto!important;transform:none!important}
.lesson-type-reminder .assessment{color:#ff9a6b}.lesson-type-reminder .assessment:before{background:#ff7a45}
.lesson-type-btn.assessment.active{color:#ffa77f;border-color:rgba(255,122,69,.45);background:rgba(255,122,69,.09)}
.lesson-profile-row.assessment .lesson-profile-track i{background:#ff7a45}
.postit-noclass .lesson-type-btn.active.nc-yes{color:#5fd6a0;border-color:rgba(55,217,150,.4);background:rgba(55,217,150,.08)}
.postit-noclass .lesson-type-btn.active.nc-school{color:#ffc46b;border-color:rgba(255,190,90,.45);background:rgba(255,190,90,.09)}
.postit-noclass .lesson-type-btn.active.nc-gov{color:#c4cddb;border-color:rgba(196,205,219,.4);background:rgba(196,205,219,.08)}
.postit-noclass small{display:block;margin-top:7px;color:#97a5b8;font-size:11px;line-height:1.4}
.lesson-postit.noclass .postit-text{opacity:.55;min-height:46px}
.school-off-tag{color:#ffc46b;font-weight:700}
.toast-stack{z-index:9999!important}.undo-toast{pointer-events:auto!important}
.undo-toast button{margin-left:auto;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:8px;padding:5px 10px;font-weight:800;font-size:11px;cursor:pointer}
.undo-toast button:hover{background:rgba(255,255,255,.1)}
.epo-heatmap .heat-today{outline:2px solid #6f8cff;outline-offset:1px}
.epo-heat-range{display:flex;justify-content:space-between;margin-top:6px;color:#74839a;font-size:11px}
.notes-countdown{color:#ffc46b;font-weight:800}.notes-countdown.urgent{color:#ff7b8f}
.v13-side-school-copy strong{white-space:normal!important;line-height:1.25}
</style>

function cloudFriendlyError(err){
 const s=String(err?.message||err||"Erro desconhecido");
 if(/invalid login|invalid_credentials/i.test(s))return "E-mail ou senha inválidos.";
 if(/email.*confirm/i.test(s))return "Confirme o e-mail da conta antes de entrar.";

 return s.length>180?s.slice(0,177)+"…":s;
}
async function cloudHttp(path,{method="GET",body=null,auth=true,headers={}}={}){
 if(!cloudConfigured())throw new Error("A conexão com o Supabase ainda não foi configurada.");
 if(!navigator.onLine)throw new Error("Sem conexão com a internet.");
 if(auth){
   const ok=await cloudEnsureSession();
   if(!ok)throw new Error("Entre na sua conta para sincronizar.");
 }
 const h={"apikey":cloudConfig.key,"Accept":"application/json",...headers};
 if(auth&&cloudSession?.access_token)h.Authorization=`Bearer ${cloudSession.access_token}`;
 if(body!==null)h["Content-Type"]="application/json";
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),14000);
 try{
   const res=await fetch(`${cloudConfig.url}${path}`,{
     method,headers:h,body:body===null?undefined:JSON.stringify(body),signal:controller.signal
   });
   const txt=await res.text();
   let data=null;
   if(txt){try{data=JSON.parse(txt)}catch(e){data=txt}}
   if(!res.ok){
     const msg=data?.msg||data?.message||data?.error_description||data?.error||`HTTP ${res.status}`;
     throw new Error(msg);
   }
   return data;
 }finally{clearTimeout(timer)}
}
async function cloudRefreshSession(){
 if(!cloudConfigured()||!cloudSession?.refresh_token)return false;
 try{
   const res=await fetch(`${cloudConfig.url}/auth/v1/token?grant_type=refresh_token`,{
     method:"POST",
     headers:{"apikey":cloudConfig.key,"Content-Type":"application/json"},
     body:JSON.stringify({refresh_token:cloudSession.refresh_token})
   });
   const data=await res.json();
   if(!res.ok)throw new Error(data?.msg||data?.message||data?.error_description||"Sessão expirada");
   cloudSession={
     access_token:data.access_token,
     refresh_token:data.refresh_token||cloudSession.refresh_token,
     expiresAt:cloudExpiryMs(data),
     user:data.user||cloudSession.user
   };
   cloudSaveSession();return true;
 }catch(e){
   cloudSession=null;cloudSaveSession();cloudLastError=cloudFriendlyError(e);renderCloudStatus();return false;
 }
}
async function cloudEnsureSession(){

async function cloudResolveConflict(choice){
 const snapshot=cloudConflict?.row;
 if(!snapshot){
   cloudLastError="O conflito já não está disponível. Atualize a verificação da nuvem.";
   renderCloudStatus();renderCloudPanel();return;
 }
 if(cloudConflictBusy)return;
 cloudConflictBusy=choice;
 cloudLastError="";
 renderCloudStatus();renderCloudPanel();

 try{
   if(choice==="remote"){
     let remoteState=snapshot.state;
     if(typeof remoteState==="string"){
       try{remoteState=JSON.parse(remoteState)}catch(e){throw new Error("A versão da nuvem não contém um estado válido.")}
     }
     if(!remoteState||typeof remoteState!=="object")throw new Error("A versão da nuvem está vazia ou inválida.");

     const row={...snapshot,state:remoteState};
     cloudApplyRemote(row,{toast:false});
     cloudConflict=null;
     cloudConflictBusy=null;
     await cloudLoadVersionList(false);
     renderCloudStatus();renderCloudPanel();
     showToast("Versão da nuvem aplicada neste computador.");
     return;
   }

   if(choice==="local"){
     // Adota a versão remota atual como base conhecida e força um novo upload.
     cloudMeta.lastCloudVersion=Number(snapshot.version||0);
     cloudMeta.lastCloudUpdatedAt=snapshot.updated_at||cloudMeta.lastCloudUpdatedAt;
     cloudMeta.pending=true;
     cloudSaveMeta();

     const ok=await cloudPush({force:true});
     if(!ok)throw new Error(cloudLastError||"Não foi possível enviar os dados deste computador.");

     cloudConflict=null;
     cloudConflictBusy=null;
     renderCloudStatus();renderCloudPanel();
     showToast("Dados deste computador enviados para a nuvem.");
     return;
   }

   throw new Error("Escolha de sincronização inválida.");
 }catch(e){
   cloudLastError=cloudFriendlyError(e);
   cloudConflictBusy=null;
   renderCloudStatus();renderCloudPanel();
 }
}

async function cloudInitialSync(){
 if(!cloudConfigured()||!cloudSignedIn())return;
 cloudSyncInFlight=true;renderCloudStatus();
 try{
   const row=await cloudFetchStateRow();
   const known=Number(cloudMeta.lastCloudVersion||0);
   if(!row){
     cloudSyncInFlight=false;
     const ok=await cloudPush({force:true});
     if(ok)showToast("Seus dados deste computador foram enviados para a nuvem.");
     return;
   }
   const remoteVersion=Number(row.version||0);
   if(known===0){
     if(HAD_LOCAL_DATA_BEFORE_BOOT||cloudMeta.pending)cloudShowConflict(row,"first-link");
     else cloudApplyRemote(row,{toast:false});
     return;
   }
   if(remoteVersion>known){
     if(cloudMeta.pending)cloudShowConflict(row,"remote-newer");
     else cloudApplyRemote(row,{toast:false});
     return;
   }
   if(remoteVersion===known&&cloudMeta.pending){
     cloudSyncInFlight=false;await cloudPush();return;
   }
   cloudMeta.lastCloudUpdatedAt=row.updated_at||cloudMeta.lastCloudUpdatedAt;
   cloudMeta.lastSyncedAt=new Date().toISOString();cloudSaveMeta();
 }catch(e){cloudLastError=cloudFriendlyError(e)}
 finally{cloudSyncInFlight=false;renderCloudStatus()}
}

function mergeState(base,saved){
 const s={...base,...saved};
 s.contentLast={...base.contentLast,...(saved.contentLast||{})};
 s.contentBaseline={...base.contentBaseline,...(saved.contentBaseline||saved.contentLast||{})};
 s.weekly=saved.weekly||{};
 s.weekClosed=saved.weekClosed||{};
 s.plans={...base.plans,...(saved.plans||{})};
 s.grades={...base.grades,...(saved.grades||{})};
 if(!s.grades[3])s.grades[3]={...base.grades[3]};
 s.grades[3]={...base.grades[3],...s.grades[3]};
 s.ementas={...base.ementas,...(saved.ementas||{})};
 // V27 migration: the old PI II "semester planning" and the Ementa
 // were the same obligation. Preserve any old completion as Ementa launched.
 EMENTAS.forEach(id=>{
   if(saved.plans?.[id]?.["2026-S2"]===true && s.ementas[id]!=="lancada")s.ementas[id]="lancada";
 });
 // V29: a Chamada foi removida. Nomes de alunos salvos em versões anteriores
 // são descartados no carregamento e não voltam para o dispositivo nem para a nuvem.
 if(Array.isArray(saved.calls)&&saved.calls.length)CALLS_PURGED=true;
 s.calls=[];
 s.lessonPlans={...(base.lessonPlans||{}),...(saved.lessonPlans||{})};
 s.sgeIssues={...(base.sgeIssues||{}),...(saved.sgeIssues||{})};
 // V29: post-its escritos "Sem aula" viram "sem aula (escola)" (continua cobrada no SGE)
 // e "Aplicação de prova" passa a ser do tipo Avaliação.
 Object.entries(s.lessonPlans||{}).forEach(([id,p])=>{
   if(!p)return;const t=String(p.text||"").trim();
   if(/^sem aula\.?$/i.test(t)&&!p.noClassMigrated&&s.weekly[id]&&!s.weekly[id].skipped){s.weekly[id].schoolOff=true;p.type="";p.noClassMigrated=true;}
   if(p.type==="questoes"&&/^aplica[çc][ãa]o de prova/i.test(t))p.type="avaliacao";
 });

 // V28: exclusões em Extras precisam sobreviver ao recarregamento.
 // "deletedExtras" funciona como um registro de exclusão (tombstone).
 s.deletedExtras={...(base.deletedExtras||{}),...(saved.deletedExtras||{})};
 const savedHasExtras=Object.prototype.hasOwnProperty.call(saved,"extras") && saved.extras && typeof saved.extras==="object";

 // Migração automática de V27 e anteriores:
 // se já existia um estado de Extras e uma atividade padrão não está nele,
 // significa que o usuário a excluiu. Registramos essa exclusão para que
 // ela não seja recriada a partir de makeDefault().
 if(savedHasExtras){
   Object.keys(base.extras||{}).forEach(id=>{
     if(!Object.prototype.hasOwnProperty.call(saved.extras,id) && !s.deletedExtras[id]){
       s.deletedExtras[id]="legacy-deleted";
     }
   });
 }

 s.extras={...(base.extras||{}),...(saved.extras||{})};
 Object.keys(s.deletedExtras||{}).forEach(id=>{delete s.extras[id]});

 s.cursinho={...(base.cursinho||{}),...(saved.cursinho||{})};
 s.analytics={
   ...base.analytics,
   ...(saved.analytics||{}),
   resolvedKeys:{...(base.analytics.resolvedKeys||{}),...((saved.analytics||{}).resolvedKeys||{})},
   events:[...((saved.analytics||{}).events||[])],
   snapshots:{...((saved.analytics||{}).snapshots||{})}
 };
 EMENTAS.forEach(id=>{
   const legacyKey=`plan:${id}:2026-S2`,newKey=`ementa:${id}:2026-S2`;
   const oldResolved=s.analytics.resolvedKeys?.[legacyKey];
   if(oldResolved){
     if(!s.analytics.resolvedKeys[newKey])s.analytics.resolvedKeys[newKey]={...oldResolved,label:`${COMPONENTS[id].turma} • ementa`};
     delete s.analytics.resolvedKeys[legacyKey];
   }
 });
 s.analytics.events=(s.analytics.events||[]).map(e=>{
   if(!String(e.key||"").startsWith("plan:mat-")||!String(e.key||"").endsWith(":2026-S2"))return e;
   const id=String(e.key).slice(5,-8);
   return EMENTAS.includes(id)?{...e,key:`ementa:${id}:2026-S2`,label:`${COMPONENTS[id].turma} • ementa`}:e;
 });
 return s;
}

function entriesForWeek(mon){
 const wk=iso(mon), out=[];
 PRESENTIAL.forEach((s,i)=>{
  const d=addDays(mon,s.dow-1), ds=iso(d);
  if(NO_CLASS.has(ds)||!inTerm(ds))return;

    id:`${wk}|P|${i}|${s.comp}`, weekKey:wk, weekEnd:iso(addDays(mon,6)),
    comp:s.comp,date:ds,effectiveDate:ds,day:s.day,time:s.time,mode:"Presencial",group:s.group||null
  });
 });
 // NP com dia e horário fixos. O ID antigo é preservado para não perder
 // registros já salvos nas versões anteriores.
 NPS.forEach((s,i)=>{
  const d=addDays(mon,s.dow-1),ds=iso(d);
  if(NO_CLASS.has(ds)||!inTerm(ds))return;
  out.push({
    id:`${wk}|NP|${i}|${s.comp}|${s.n}`, weekKey:wk, weekEnd:iso(addDays(mon,6)),
    comp:s.comp,date:ds,effectiveDate:ds,day:s.day,time:s.time,mode:`NP ${s.n}`,group:null

 });

}

function expectedEntriesForComp(comp,fromExclusive,toInclusive){
 const start=addDays(parseISO(fromExclusive),1);
 let mon=mondayOf(start);

 const out=[];
 while(mon<=endMon){
   entriesForWeek(mon).forEach(e=>{
     if(e.comp===comp && e.effectiveDate>fromExclusive && e.effectiveDate<=toInclusive)out.push(e);
   });
   mon=addDays(mon,7);

// V29: "atrasado" = qualquer aula de um dia anterior a hoje ainda sem conteúdo

function overdueEntries(comp=null){
 const yesterday=iso(addDays(parseISO(analyticsDate()),-1)),out=[];
 (comp?[comp]:Object.keys(COMPONENTS)).forEach(id=>{
   const cBase=state.contentBaseline?.[id]||LAST_CONTENT[id];
   const from=cBase<BASE_FREQ_THROUGH?cBase:BASE_FREQ_THROUGH;
   if(from>=yesterday)return;
   expectedEntriesForComp(id,from,yesterday).forEach(e=>{
     const r=rec(e);if(r.skipped)return;
     const c=e.effectiveDate>cBase&&!r.contentPosted,f=e.effectiveDate>BASE_FREQ_THROUGH&&!r.attendancePosted;
     if(c||f)out.push({...e,_c:c,_f:f});

 let last=base;
 for(const d of Object.keys(byDate).sort()){
   const complete=byDate[d].every(e=>{const r=rec(e);return r.skipped||r.contentPosted;});
   if(complete)last=d; else break;
 }

}

const LESSON_TYPES={
  expositiva:{label:"Expositiva",short:"Expositiva",cls:"expositive"},
  diversificada:{label:"Diversificada",short:"Diversificada",cls:"diverse"},
  questoes:{label:"Resolução de questões",short:"Resolução",cls:"questions"},
  avaliacao:{label:"Avaliação",short:"Avaliação",cls:"assessment"}
};
// V29: dois tipos de "sem aula", guardados no próprio registro do SGE.
//  - governo (skipped): dia suspenso, não pode ser registrado no SGE.
//  - escola (schoolOff): sem aula por organização interna, mas precisa ser registrado como aula.
function lessonNoClassKind(entry){const r=state.weekly[entry.id];return r?.skipped?"governo":r?.schoolOff?"escola":""}
function setLessonNoClass(id,kind){
 const entries=presentialEntriesForWeek(),idx=entries.findIndex(x=>x.id===id);if(idx<0)return;
 const max=eligibleLessonSequence(entries,idx).length,cov=state.lessonPlans[id]?Math.min(lessonPlanRecord(id,entries[idx]).coverage,max):1;
 const next=lessonNoClassKind(entries[idx])===kind?"":kind;
 eligibleLessonSequence(entries,idx).slice(0,cov).forEach(e=>{const r=rec(e);r.skipped=next==="governo";r.schoolOff=next==="escola";syncContentLast(e.comp)});
 save();renderWeeklyLessonPlans();renderResumo();renderNav();
}

function lessonPlanMonday(){
 return addDays(mondayOf(TODAY()),lessonPlanWeekOffset*7);
}
function presentialEntriesForWeek(mon=lessonPlanMonday()){
 return entriesForWeek(mon).filter(e=>e.mode==="Presencial").sort((a,b)=>{
   if(a.date!==b.date)return a.date.localeCompare(b.date);
   return timeToMin(a.time)-timeToMin(b.time);
 });
}
function lessonTimeParts(time){
 const parts=String(time).split(/[–-]/).map(x=>x.trim());
 const toMin=x=>{const [h,m]=x.split(":").map(Number);return h*60+m};
 return {start:toMin(parts[0]),end:toMin(parts[1]),startText:parts[0],endText:parts[1]};
}
function isConsecutiveLesson(a,b){
 if(!a||!b||a.date!==b.date)return false;
 const ca=COMPONENTS[a.comp],cb=COMPONENTS[b.comp];
 if(!ca||!cb||ca.turma!==cb.turma)return false;
 return lessonTimeParts(a.time).end===lessonTimeParts(b.time).start;
}
function eligibleLessonSequence(entries,index){
 const seq=[entries[index]];
 for(let i=index+1;i<entries.length&&seq.length<3;i++){
   const prev=seq[seq.length-1],next=entries[i];
   if(!isConsecutiveLesson(prev,next))break;
   seq.push(next);
 }
 return seq;
}
function lessonPlanRecord(id,entry=null){
 const r=state.lessonPlans[id]||{};
 return {
   text:r.text||"",
   type:r.type||"",
   coverage:Math.max(1,Math.min(3,Number(r.coverage)||1)),
   date:r.date||entry?.date||"",
   turma:r.turma||COMPONENTS[entry?.comp]?.turma||"",
   comp:r.comp||entry?.comp||"",
   updatedAt:r.updatedAt||null
 };
}
function ensureLessonPlan(id,entry){
 if(!state.lessonPlans[id])state.lessonPlans[id]=lessonPlanRecord(id,entry);
 const r=state.lessonPlans[id];
 if(!r.date)r.date=entry.date;
 if(!r.turma)r.turma=COMPONENTS[entry.comp].turma;
 if(!r.comp)r.comp=entry.comp;
 if(!r.coverage)r.coverage=1;
 return r;
}
function lessonCoverageMap(entries){
 const map={};
 entries.forEach((e,i)=>{
   if(map[e.id])return;
   const stored=state.lessonPlans[e.id];
   if(!stored)return;
   const max=eligibleLessonSequence(entries,i).length;
   const cov=Math.min(Math.max(1,Number(stored.coverage)||1),max);
   for(let k=0;k<cov;k++)map[entries[i+k].id]=e.id;
 });
 return map;
}
function setLessonPlanText(id,value){
 const entries=presentialEntriesForWeek();
 const e=entries.find(x=>x.id===id);if(!e)return;
 const r=ensureLessonPlan(id,e);r.text=value;r.updatedAt=Date.now();save();
 renderLessonPlanTopOnly();
}
function setLessonPlanType(id,type){
 const entries=presentialEntriesForWeek();
 const e=entries.find(x=>x.id===id);if(!e)return;
 const r=ensureLessonPlan(id,e);
 r.type=r.type===type?"":type;
 r.updatedAt=Date.now();save();renderWeeklyLessonPlans();renderResumo();renderNav();
}
function setLessonPlanCoverage(id,n){
 const entries=presentialEntriesForWeek();
 const idx=entries.findIndex(x=>x.id===id);if(idx<0)return;
 const seq=eligibleLessonSequence(entries,idx);
 const r=ensureLessonPlan(id,entries[idx]);
 r.coverage=Math.max(1,Math.min(Number(n)||1,seq.length));
 r.updatedAt=Date.now();save();renderWeeklyLessonPlans();renderResumo();renderNav();
}
function clearLessonPlan(id){

function lessonPlanSummary(mon=lessonPlanMonday()){
 const entries=presentialEntriesForWeek(mon),map=lessonCoverageMap(entries);
 let planned=0,typed=0;
 entries.forEach(e=>{
   if(lessonNoClassKind(e)){planned++;typed++;return}
   const anchor=map[e.id];
   if(!anchor)return;
   const r=lessonPlanRecord(anchor);
   if(r.type)typed++;
   if(r.type&&(r.text||"").trim())planned++;
 });
 return {total:entries.length,planned,typed,pending:Math.max(0,entries.length-planned)};
}
function weeklyLessonPlanPending(){

function lessonTypeStats(monthKey=null){
 const totals={expositiva:0,diversificada:0,questoes:0,avaliacao:0};
 Object.entries(state.lessonPlans||{}).forEach(([id,r])=>{
   if(!r?.type||!LESSON_TYPES[r.type])return;
   if(state.weekly[id]?.skipped||state.weekly[id]?.schoolOff)return;
   const date=r.date||"";
   if(monthKey&&(!date||!date.startsWith(monthKey)))return;
   totals[r.type]+=Math.max(1,Math.min(3,Number(r.coverage)||1));
 });
 const total=Object.values(totals).reduce((a,b)=>a+b,0);
 return {totals,total};
}
function lessonPlanTypeName(type){return LESSON_TYPES[type]?.label||"Tipo não definido"}
function coveredLessonInfo(entries,index,coverage){
 const seq=eligibleLessonSequence(entries,index).slice(0,coverage);
 const comps=seq.map(e=>COMPONENTS[e.comp]);
 const first=seq[0],last=seq[seq.length-1];
 const firstTime=lessonTimeParts(first.time),lastTime=lessonTimeParts(last.time);
 const subjects=comps.map(c=>c.tipo==="exp"?"Experimental":c.nome).filter((x,i,a)=>i===0||x!==a[i-1]);
 return {
   seq,
   subjects,
   time:`${firstTime.startText}–${lastTime.endText}`,
   label:subjects.join(" → ")
 };
}

 const coverButtons=Array.from({length:max},(_,k)=>k+1).map(n=>`

 return `<article class="lesson-postit ${c.tipo} ${complete?"complete":""} ${nc?"noclass":""}" data-plan="${entry.id}">
   <span class="postit-tape"></span>
   <span class="postit-fold"></span>
   <div class="postit-head">
     <div>

     <span>A aula vai acontecer?</span>

   </div>

const EXTRA_STATUS={
  afazer:"A fazer",
  andamento:"Em andamento",

};
function extraAll(){
 return Object.values(state.extras||{});
}
function extraIsExpired(x){
 // Overdue is a visual state only. An unfinished task must not disappear.
 return !!x.due && x.status!=="concluida" && x.due<analyticsDate();
}
function extraVisible(){
 return extraAll().filter(x=>x.status!=="concluida");
}
function extraCompleted(){
 return extraAll().filter(x=>x.status==="concluida");
}
function extraExpired(){
 return extraVisible().filter(extraIsExpired);
}

 return extraVisible().length;
}
function extraDaysLeft(due){
 if(!due)return null;
 const a=parseISO(analyticsDate()),b=parseISO(due);
 return Math.round((b-a)/86400000);

function extraDeadlineText(x){

/* ==========================================================
   OCORRÊNCIAS DO SGE PARA COORDENAÇÃO
   ========================================================== */
const SGE_ISSUE_TYPES={
  freq_dup:"Frequência duplicada",
  freq_missing:"Frequência não disponível / não aparece",
  content_dup:"Conteúdo duplicado",
  other:"Outro erro no SGE"
};
function sgeIssueList(){
 return Object.values(state.sgeIssues||{}).sort((a,b)=>{
   if(!!a.resolved!==!!b.resolved)return a.resolved?1:-1;
   return (b.date||"").localeCompare(a.date||"");
 });
}
function sgeIssueOpen(){return sgeIssueList().filter(x=>!x.resolved)}
function toggleSgeIssueEditor(){sgeIssueEditorOpen=!sgeIssueEditorOpen;renderAtualizar()}

function isFrequencyIssueKind(kind){
 return kind==="freq_dup"||kind==="freq_missing";
}
function sgeIssueClassesForDate(date){
 if(!date||!isTeachingDay(date))return [];
 const dow=parseISO(date).getDay(),rows=[...PRESENTIAL.filter(x=>x.dow===dow),...NPS.filter(x=>x.dow===dow)];
 const byComp=new Map();
 rows.forEach(x=>{
   const c=COMPONENTS[x.comp];if(!c)return;
   if(!byComp.has(x.comp))byComp.set(x.comp,{
     comp:x.comp,turma:c.turma,subject:c.tipo==="exp"?"Experimental":c.nome,
     times:[],hasPresential:false,hasNP:false
   });
   const item=byComp.get(x.comp);
   item.times.push(x.time);
   if("n" in x)item.hasNP=true;else item.hasPresential=true;
 });
 return [...byComp.values()].sort((a,b)=>{
   const ta=a.times[0]||"99:99",tb=b.times[0]||"99:99";
   const ma=Number(ta.slice(0,2))*60+Number(ta.slice(3,5));
   const mb=Number(tb.slice(0,2))*60+Number(tb.slice(3,5));
   return ma-mb||a.turma.localeCompare(b.turma,"pt-BR",{numeric:true})||a.subject.localeCompare(b.subject,"pt-BR");
 });
}
function sgeIssueCompOptionsHtml(date,selected=""){
 const rows=sgeIssueClassesForDate(date);
 if(!rows.length)return `<option value="">Nenhuma aula prevista nesta data</option>`;
 return rows.map(x=>{
   const mode=x.hasPresential&&x.hasNP?"Presencial + NP":x.hasNP?"NP":"Presencial";
   return `<option value="${x.comp}" ${x.comp===selected?"selected":""}>${x.turma} • ${x.subject} • ${mode}</option>`;
 }).join("");
}
function sgeIssueDuplicate(date,comp,kind){
 if(!date||!comp||!isFrequencyIssueKind(kind))return null;
 const turma=COMPONENTS[comp]?.turma;if(!turma)return null;
 return sgeIssueList().find(x=>
   x.date===date &&
   x.kind===kind &&
   COMPONENTS[x.comp]?.turma===turma
 )||null;
}
function refreshSgeIssueDuplicateState(){
 const date=document.getElementById("sgeIssueDate")?.value||"";
 const comp=document.getElementById("sgeIssueComp")?.value||"";
 const kind=document.getElementById("sgeIssueKind")?.value||"freq_dup";
 const warning=document.getElementById("sgeIssueDuplicateWarning");
 const saveBtn=document.getElementById("sgeIssueSaveBtn");
 const duplicate=sgeIssueDuplicate(date,comp,kind);
 const noClass=!comp;
 if(warning){
   if(duplicate){
     const c=COMPONENTS[duplicate.comp],label=SGE_ISSUE_TYPES[kind]||"Erro de frequência";
     warning.innerHTML=`<b>Já registrado.</b> ${label} para a turma ${c?.turma||"—"} em ${br(date)}.`;
     warning.classList.add("show");
   }else{
     warning.textContent="";
     warning.classList.remove("show");
   }
 }
 if(saveBtn)saveBtn.disabled=!!duplicate||noClass;
}
function refreshSgeIssueCompOptions(){
 const date=document.getElementById("sgeIssueDate")?.value||"";
 const select=document.getElementById("sgeIssueComp");
 const hint=document.getElementById("sgeIssueDayHint");
 if(!select)return;
 const previous=select.value;
 const rows=sgeIssueClassesForDate(date);
 const keep=rows.some(x=>x.comp===previous)?previous:"";
 select.innerHTML=sgeIssueCompOptionsHtml(date,keep);
 select.disabled=!rows.length;
 if(rows.length&&!keep)select.value=rows[0].comp;
 if(hint){
   if(!date)hint.textContent="Escolha uma data para carregar suas turmas.";
   else if(!rows.length)hint.textContent="Você não tem aula prevista nesta data.";
   else{
     const turmas=[...new Set(rows.map(x=>x.turma))];
     hint.textContent=`${turmas.length} turma${turmas.length===1?"":"s"} • ${rows.length} componente${rows.length===1?"":"s"} neste dia`;
   }
 }
 refreshSgeIssueDuplicateState();
}
function saveSgeIssue(){
 const date=document.getElementById("sgeIssueDate")?.value||"";
 const comp=document.getElementById("sgeIssueComp")?.value||"";
 const kind=document.getElementById("sgeIssueKind")?.value||"freq_dup";
 const note=document.getElementById("sgeIssueNote")?.value.trim()||"";
 if(!date){showToast("Informe a data do erro.");return}
 const available=sgeIssueClassesForDate(date);
 if(!available.length){showToast("Você não tem aula prevista nessa data.","warning");return}
 if(!comp||!available.some(x=>x.comp===comp)){showToast("Escolha uma turma que você ministra nessa data.","warning");return}
 const duplicate=sgeIssueDuplicate(date,comp,kind);
 if(duplicate){
   const turma=COMPONENTS[comp]?.turma||"—";
   showToast(`Esse erro de frequência já foi registrado para a turma ${turma} em ${br(date)}.`,"warning");
   refreshSgeIssueDuplicateState();
   return;
 }
 const id=`issue-${Date.now()}`;
 state.sgeIssues[id]={id,date,comp,kind,note,resolved:false,createdAt:analyticsDate(),resolvedAt:null};
 save();sgeIssueEditorOpen=false;refreshAfterMutation("atualizar");showToast("Ocorrência salva para a coordenação.");
}
function toggleSgeIssueResolved(id){
 const x=state.sgeIssues[id];if(!x)return;
 x.resolved=!x.resolved;x.resolvedAt=x.resolved?analyticsDate():null;
 save();refreshAfterMutation("atualizar");
}
function deleteSgeIssue(id){
 const x=state.sgeIssues[id];if(!x)return;
 if(!confirm("Excluir esta ocorrência do SGE?"))return;
 delete state.sgeIssues[id];save();refreshAfterMutation("atualizar");
}
function sgeIssueMessage(){
 const list=sgeIssueOpen();
 if(!list.length)return "";
 const lines=list.map(x=>{
   const c=COMPONENTS[x.comp];
   const subject=c?.tipo==="exp"?"Prática Experimental de Física":c?.nome||x.comp;
   const extra=x.note?` — ${x.note}`:"";

function organizationTasks(){
 const tasks=[],today=analyticsDate(),term=currentTerm(),mk=currentMonthKey();
 const push=t=>{const band=priorityBand(t.due,t.force),attention=t.attention!==undefined?t.attention:taskAttention(t.due,t.lead||0,t.force),d=daysUntil(t.due);tasks.push({...t,band,attention,days:d,score:priorityRank(band)*100+(d??99)})};

 const od=overdueSummary();
 if(od.list.length){
   push({id:"sge-overdue",kind:"sge",area:"SGE",title:`Registros atrasados no SGE • ${od.list.length} aula(s)`,sub:`${od.content} conteúdo(s) • ${od.freq} frequência(s) de dias anteriores`,due:od.list[0].effectiveDate,lead:999,icon:"building",next:"Abrir Pendências acumuladas: ali estão todas as aulas de dias anteriores ainda não confirmadas.",action:"openAccumulated()"});

 const mon=mondayOf(TODAY()),week=activeEntries(entriesForWeek(mon)),weekEnd=iso(addDays(mon,6));
 const restWeek=week.filter(e=>e.date>=today),mc=restWeek.filter(e=>!rec(e).contentPosted).length,mf=restWeek.filter(e=>!rec(e).attendancePosted).length;
 if(mc+mf)push({id:`sge-week:${iso(mon)}`,kind:"sge",area:"SGE",title:"Registrar o restante da semana",sub:`${mc} conteúdo(s) • ${mf} frequência(s) de hoje em diante`,due:weekEnd,lead:2,icon:"building",next:"Conferir a semana em um único painel; a anotação local continua opcional.",action:"openCurrentWeek()"});

 // As NP agora têm horário real: quando chega o dia, o app cobra apenas
 // as que ainda não foram confirmadas no SGE.
 const npByDate={};
 week.filter(e=>e.mode.startsWith("NP")&&e.date>=today).forEach(e=>{
   const r=rec(e);
   if(r.contentPosted&&r.attendancePosted)return;
   (npByDate[e.date]??=[]).push(e);
 });
 Object.entries(npByDate).forEach(([date,entries])=>{
   const labels=[...new Set(entries.map(e=>`${COMPONENTS[e.comp].turma} ${COMPONENTS[e.comp].tipo==="mat"?"Matemática":"Física"}`))];
   const weekday=parseISO(date).toLocaleDateString("pt-BR",{weekday:"long"});
   push({id:`np-day:${date}`,kind:"np",area:"SGE",title:`NP de ${weekday} • ${entries.length} pendente(s)`,sub:labels.join(" • "),due:date,lead:0,icon:"note",next:"Abrir o SGE do dia e confirmar conteúdo e frequência das aulas NP.",action:`openSgeForDate('${date}')`});
 });

 const issues=sgeIssueOpen();
 if(issues.length){const oldest=issues.map(x=>x.createdAt||today).sort()[0];push({id:"sge-issues",kind:"issue",area:"SGE",title:`Pedir correção de ${issues.length} erro(s) no SGE`,sub:"Ocorrências aguardando coordenação",due:oldest,lead:999,force:true,icon:"note",next:"Copiar a mensagem pronta e encaminhar para a coordenação.",action:"goSgeIssues()"})}


 [mk,nextMonthKey(mk)].forEach(key=>{if(key<"2026-08"||key>"2026-12")return;const pending=MONTHLY_PLANS.filter(id=>!state.plans[id]?.[key]);if(pending.length)push({id:`monthly:${key}`,kind:"plan",area:"Planos",title:`Planejamentos de ${monthLabelFromKey(key)} • ${pending.length} pendente(s)`,sub:"Meta interna: deixar o mês preparado desde o início",due:`${key}-01`,lead:7,icon:"planner",next:"Abrir Planos e concluir somente os componentes ainda pendentes.",action:"show('planejamentos')"})});

 const emPending=EMENTAS.filter(id=>(state.ementas[id]||"nao-informado")!=="lancada");
 if(emPending.length)push({id:"ementas",kind:"ementa",area:"Planos",title:`Ementas do Projeto Integrador II • ${emPending.length} a resolver`,sub:"1 ementa por turma para todo o semestre • sem prazo informado",due:null,attention:false,icon:"note",next:"Abrir Planos e confirmar quais ementas já foram lançadas.",action:"show('planejamentos')"});

 if(term){const pending=GRADE_COMPONENTS.filter(id=>!state.grades[term.n]?.[id]);if(pending.length)push({id:`grades:${term.n}`,kind:"grade",area:"Notas",title:`Notas do ${term.n}º bimestre • ${pending.length} turma(s)`,sub:`Encerramento em ${br(term.end)}`,due:term.end,lead:14,icon:"calculator",next:"Conferir quais turmas já tiveram as notas lançadas no SGE.",action:"show('notas')"})}

 for(let i=0;i<=7;i++){
   const date=datePlus(today,i);if(!isTeachingDay(date))continue;const n=incompleteLessonPlansForDate(date);if(!n)continue;
   const weekday=parseISO(date).toLocaleDateString("pt-BR",{weekday:"long"}),due=datePlus(date,-1);
   push({id:`lessonplans:${date}`,kind:"lessonplan",area:"Semana",title:`Preparar ${n} plano${n===1?"":"s"} para ${weekday}`,sub:`Aulas de ${br(date)}`,due,lead:3,icon:"sticky",next:"Abrir os post-its e registrar somente o roteiro necessário para entrar em sala.",action:`openPlansForDate('${date}')`,targetDate:date});
 }

 TONOENEM_LESSONS.filter(x=>x.date>=today&&!toneRec(x.id).checks.pronta).forEach(x=>push({id:`tono:${x.id}`,kind:"tono",area:"#TONOENEM",title:`Preparar #TONOENEM • ${x.label}`,sub:`Aula em ${br(x.date)}`,due:x.date,lead:7,icon:"presentation",next:tonoNextAction(x.id),action:`goToneLesson('${x.id}')`,targetDate:x.date}));

 extraVisible().forEach(x=>push({id:`extra:${x.id}`,kind:"extra",area:"Extras",title:x.title,sub:x.due?`Prazo ${br(x.due)}`:"Sem prazo definido",due:x.due||null,lead:14,attention:x.due?undefined:false,icon:"trophy",next:x.note&&x.note!=="Captura rápida"?x.note:"Abrir a atividade e definir a próxima etapa.",action:`goExtraActivity('${x.id}')`,targetDate:x.due||null}));

 return tasks.sort((a,b)=>a.score-b.score||String(a.due||"9999").localeCompare(String(b.due||"9999"))||a.title.localeCompare(b.title,"pt-BR"));
}

function updateGroups(){
 const es=weekEntries();
 if(updateView==="turma"){
   const by={};
   es.forEach(e=>{
     const turma=COMPONENTS[e.comp].turma;
     if(!by[turma])by[turma]=[];
     by[turma].push(e);
   });
   return Object.keys(by).sort((a,b)=>a.localeCompare(b,"pt-BR",{numeric:true})).map(turma=>{
     const entries=by[turma].sort((a,b)=>{
       const da=a.date||"9999-12-31", db=b.date||"9999-12-31";
       if(da!==db)return da.localeCompare(db);
       if(a.mode.startsWith("NP")&&!b.mode.startsWith("NP"))return 1;
       if(!a.mode.startsWith("NP")&&b.mode.startsWith("NP"))return -1;
       return timeToMin(a.time)-timeToMin(b.time);
     });
     const comps=[...new Set(entries.map(e=>COMPONENTS[e.comp].nome))];
     return {key:`turma:${turma}`,label:`Turma ${turma}`,sublabel:`${comps.join(" • ")} • ${entries.length} registros`,entries};
   });
 }
 const by={};
 es.forEach(e=>{if(!by[e.day])by[e.day]=[];by[e.day].push(e)});
 const order=["Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira"];
 return order.filter(day=>by[day]?.length).map(day=>{
   const entries=by[day].sort((a,b)=>timeToMin(a.time)-timeToMin(b.time));
   const npCount=entries.filter(e=>e.mode.startsWith("NP")).length;
   const presencialCount=entries.filter(e=>e.mode==="Presencial").length;
   const parts=[];
   if(presencialCount)parts.push(`${presencialCount} presencial${presencialCount>1?"is":""}`);
   if(npCount)parts.push(`${npCount} NP`);
   return {
     key:`data:${day}`,
     label:day,
     sublabel:`${br(entries[0].date)} • ${parts.join(" • ")}`,
     entries
   };
 });
}
function accumulatedGroups(){

 all.forEach(e=>{const turma=COMPONENTS[e.comp].turma;(by[turma]??=[]).push(e)});

   const entries=by[turma].sort((a,b)=>a.effectiveDate.localeCompare(b.effectiveDate)||timeToMin(a.time)-timeToMin(b.time));
   const comps=[...new Set(entries.map(e=>COMPONENTS[e.comp].tipo==="exp"?"Experimental":COMPONENTS[e.comp].nome))];
   return {
     key:`acum:${turma}`,label:`Turma ${turma}`,

 });
}

function setWeek(id,field,val){
 const e=[...weekEntries(),...accumulatedGroups().flatMap(g=>g.entries)].find(x=>x.id===id);
 if(!e)return;
 const r=rec(e),prev=r[field];r[field]=val;
 if(field==="contentPosted"&&prev!==val)recordResolution(`sge:content:${e.id}`,!!val,"SGE",e.comp,`${COMPONENTS[e.comp].turma} • conteúdo`);
 if(field==="attendancePosted"&&prev!==val)recordResolution(`sge:freq:${e.id}`,!!val,"SGE",e.comp,`${COMPONENTS[e.comp].turma} • frequência`);
 if(field==="contentPosted"||field==="skipped")syncContentLast(e.comp);
 save();renderNav();renderResumo();
 if(field!=="content")renderAtualizar();
 if((field==="contentPosted"||field==="attendancePosted")&&val&&!prev){
   const key=`sge:${field==="contentPosted"?"content":"freq"}:${e.id}`;
   showUndoToast(`${COMPONENTS[e.comp].turma} ${br(e.date).slice(0,5)}: ${field==="contentPosted"?"conteúdo":"frequência"} marcado`,()=>{
     const r2=state.weekly[e.id];if(r2)r2[field]=prev;forgetResolution(key);
     if(field==="contentPosted")syncContentLast(e.comp);
     save();renderNav();renderResumo();renderAtualizar();
   });
 }
}
function usePreviousContent(id){

 let candidates=[];
 Object.entries(state.weekly).forEach(([k,r])=>{
  const comp=r.comp||Object.keys(COMPONENTS).find(cid=>k.includes(cid));
  if(comp===e.comp && r.content && k<id)candidates.push([k,r.content]);
 });
 candidates.sort((a,b)=>b[0].localeCompare(a[0]));
 if(candidates.length){rec(e).content=candidates[0][1];save();renderAtualizar()}

}
function markGroup(groupKey,field){
 const group=currentUpdateGroups().find(g=>g.key===groupKey);
 if(!group)return;
 const changed=[];
 group.entries.forEach(e=>{
   const r=rec(e);
   const prev=r[field];
   changed.push({id:e.id,field,prev,comp:e.comp});
   r[field]=true;
   if(!prev&&field==="contentPosted")recordResolution(`sge:content:${e.id}`,true,"SGE",e.comp,`${COMPONENTS[e.comp].turma} • conteúdo`);
   if(!prev&&field==="attendancePosted")recordResolution(`sge:freq:${e.id}`,true,"SGE",e.comp,`${COMPONENTS[e.comp].turma} • frequência`);
 });
 lastBulkUndo={label:field==="contentPosted"?"conteúdos":"frequências",changed};
 [...new Set(group.entries.map(e=>e.comp))].forEach(syncContentLast);
 save();refreshAfterMutation("atualizar");
}
function undoLastBulk(){

 lastBulkUndo.changed.forEach(x=>{
   const r=state.weekly[x.id];if(r)r[x.field]=x.prev;
   if(!x.prev)forgetResolution(`sge:${x.field==="contentPosted"?"content":"freq"}:${x.id}`);
 });
 [...new Set(lastBulkUndo.changed.map(x=>x.comp))].forEach(syncContentLast);
 lastBulkUndo=null;save();refreshAfterMutation("atualizar");
}

function forgetResolution(key){
 ensureAnalytics();
 if(!state.analytics.resolvedKeys[key])return;
 delete state.analytics.resolvedKeys[key];
 const ev=state.analytics.events;
 for(let i=ev.length-1;i>=0;i--){if(ev[i].key===key&&ev[i].kind==="resolved"){ev.splice(i,1);break}}
}
let undoSeq=0;const undoActions={};
function runUndo(n){const fn=undoActions[n];delete undoActions[n];document.querySelector(`[data-undo="${n}"]`)?.remove();if(fn)fn()}
function showUndoToast(message,fn){
 const stack=document.getElementById("toastStack");if(!stack)return;
 const n=++undoSeq;undoActions[n]=fn;
 stack.querySelectorAll("[data-undo]").forEach(x=>x.remove());
 const item=document.createElement("div");
 item.className="toast success undo-toast";item.dataset.undo=n;
 item.innerHTML=`<span class="toast-icon">${iconSvg("check",17)}</span><span>${esc(message)}</span><button onclick="runUndo(${n})">Desfazer</button>`;
 stack.appendChild(item);
 requestAnimationFrame(()=>item.classList.add("show"));
 setTimeout(()=>{delete undoActions[n];item.classList.remove("show");setTimeout(()=>item.remove(),220)},6000);
}
function showToast(message,type="success"){
 const stack=document.getElementById("toastStack");if(!stack)return;
 const item=document.createElement("div");
 item.className=`toast ${type}`;
 item.innerHTML=`<span class="toast-icon">${type==="success"?iconSvg("check",17):type==="warning"?"!":"i"}</span><span>${esc(message)}</span>`;
 stack.appendChild(item);
 requestAnimationFrame(()=>item.classList.add("show"));
 setTimeout(()=>{item.classList.remove("show");setTimeout(()=>item.remove(),220)},3000);
}

function renderWorkspace(groups,isAccum){
 if(!groups.length)return `<div class="workspace-empty">${isAccum?"Nenhuma pendência acumulada.":"Nenhuma aula prevista nesta semana."}</div>`;
 if(!workspaceSelection||!groups.some(g=>g.key===workspaceSelection))workspaceSelection=groups[0].key;
 const selected=groups.find(g=>g.key===workspaceSelection)||groups[0];
 const list=groups.map(g=>{
   const s=workspaceGroupStats(g),pending=s.isAccum?s.active:(s.total-s.done);
   return `<button class="workspace-nav-item ${g.key===selected.key?"active":""}" onclick="selectWorkspace('${g.key}')">
     <span class="workspace-nav-main"><strong>${esc(g.label.replace("Turma ",""))}</strong><small>${esc(g.sublabel.replace(/ • \d+ registros?/,""))}</small></span>
     <span class="workspace-nav-count ${pending?"":"done"}">${pending||"✓"}</span>
     ${!s.isAccum?`<span class="workspace-nav-progress"><i style="width:${s.pct}%"></i></span>`:""}
   </button>`;
 }).join("");
 const st=workspaceGroupStats(selected);
 const rows=selected.entries.map(workspaceLessonHtml).join("");
 return `<div class="workspace-shell">
   <aside class="workspace-sidebar">
     <div class="workspace-sidebar-head"><span>${isAccum?"Turmas com atraso":"Turmas / grupos"}</span><b>${groups.length}</b></div>
     <div class="workspace-nav">${list}</div>
   </aside>
   <section class="workspace-detail">
     <div class="workspace-detail-head">
       <div>
         <span class="workspace-overline">${isAccum?"Pendências acumuladas":"Grupo selecionado"}</span>
         <h2>${esc(selected.label)}</h2>
         <p>${esc(selected.sublabel)}</p>
       </div>
       <div class="workspace-head-actions">
         <button class="btn small" onclick="markGroup('${selected.key}','attendancePosted')">Marcar frequências</button>
         <button class="btn small" onclick="markGroup('${selected.key}','contentPosted')">Marcar conteúdos</button>
       </div>
     </div>
     <div class="workspace-progress">
       <span>${isAccum?`${st.active} conteúdo(s) pendente(s)`:`${st.cp}/${st.active} conteúdo • ${st.fp}/${st.active} frequência`}</span>
       ${!isAccum?`<div><i style="width:${st.pct}%"></i></div>`:""}
     </div>
     <div class="work-list ${density==="compact"?"compact":""}">${rows}</div>
   </section>
 </div>`;
}
function renderAtualizar(){
 const w=weekStats(),mon=weekMonday(),closed=w.total>0&&w.cp===w.total&&w.fp===w.total;
 const groups=currentUpdateGroups(),isAccum=updateScope==="acumulado";
 document.getElementById("sec-atualizar").innerHTML=`
   <div class="v13-section-toolbar">
     <div class="segmented">
       <button class="${!isAccum?"active":""}" onclick="setUpdateScope('semana')">Semana</button>
       <button class="${isAccum?"active":""}" onclick="setUpdateScope('acumulado')">Pendências acumuladas</button>
     </div>
     ${!isAccum?`<div class="week-switcher">
       <button onclick="changeWeek(-1)">←</button><span>${br(iso(mon))} — ${br(weekEnd())}</span><button onclick="changeWeek(1)">→</button>
       <button class="today" onclick="changeWeek(0,true)">Hoje</button>
     </div>`:""}
     ${!isAccum?`<div class="segmented subtle"><button class="${updateView==="turma"?"active":""}" onclick="setUpdateView('turma')">Por turma</button><button class="${updateView==="data"?"active":""}" onclick="setUpdateView('data')">Por data</button></div>`:""}
   </div>

   ${lastBulkUndo?`<div class="undo-bar"><span>Última ação em lote: ${lastBulkUndo.label} marcados.</span><button class="btn small" onclick="undoLastBulk()">Desfazer</button></div>`:""}

   <div class="sge-visual-summary">
      ${(()=>{const es=activeEntries(weekEntries()),n=t=>es.filter(e=>COMPONENTS[e.comp].tipo===t).length;return [["fis","Física"],["mat","Matemática"],["exp","Experimental"]].map(([t,l])=>`<div class="sge-summary-chip ${t}"><b>${n(t)}</b><span>aula(s) de ${l} nesta semana</span></div>`).join("")})()}

   </div>

   ${renderWorkspace(groups,isAccum)}

   ${renderSgeIssuesPanel()}

   ${!isAccum?`<div class="v13-close-week">
      <div><strong>${closed?"Semana completa ✓":"Situação da semana"}</strong><span>${closed?"Conteúdo e frequência confirmados em todas as aulas realizadas.":`Faltam ${w.total-w.cp} conteúdo(s) e ${w.total-w.fp} frequência(s). A semana se fecha sozinha quando tudo estiver lançado.`}</span></div>
      <div class="v13-close-stats"><span>${w.cp}/${w.total} conteúdo</span><span>${w.fp}/${w.total} frequência</span>${w.skipped?`<span>${w.skipped} não realizada(s)</span>`:""}</div>
   </div>`:""}`;
}
function changeWeek(n,reset=false){
 weekOffset=reset?0:weekOffset+n;workspaceSelection=null;openGroups={};openContent={};lastBulkUndo=null;openRowMenuId=null;saveUIContext();renderAtualizar();renderNav()
}

function renderPlanejamentos(){
 const mk=currentMonthKey(),monthNames={"2026-08":"Agosto","2026-09":"Setembro","2026-10":"Outubro","2026-11":"Novembro","2026-12":"Dezembro"};
 const currentMonthly=(mk>="2026-08"&&mk<="2026-12")?MONTHLY_PLANS:[];
 const monthlyPending=currentMonthly.filter(id=>!state.plans[id]?.[mk]).length;
 const ementaPending=EMENTAS.filter(id=>(state.ementas[id]||"nao-informado")!=="lancada").length;
 const totalPending=monthlyPending+ementaPending;

 const ementaPendingHtml=EMENTAS.filter(id=>(state.ementas[id]||"nao-informado")!=="lancada").map(id=>{
   const c=COMPONENTS[id],st=state.ementas[id]||"nao-informado";
   return `<article class="module-task-card mat"><div class="module-task-main"><div class="module-task-top"><span class="module-turma">${c.turma}</span></div><strong>Ementa • Projeto Integrador II</strong><small>Única do semestre • duração de 6 meses</small></div><select class="module-select ${st}" onchange="setEmenta('${id}',this.value)"><option value="nao-informado" ${st==="nao-informado"?"selected":""}>A confirmar</option><option value="pendente" ${st==="pendente"?"selected":""}>Pendente</option><option value="lancada">✓ Lançada</option></select></article>`;
 }).join("");
 const ementaDoneHtml=EMENTAS.filter(id=>(state.ementas[id]||"nao-informado")==="lancada").map(id=>{
   const c=COMPONENTS[id];
   return `<article class="module-task-card mat"><div class="module-task-main"><span class="module-turma">${c.turma}</span><strong>Ementa • Projeto Integrador II</strong><small>Semestre atual</small></div><select class="module-select lancada" onchange="setEmenta('${id}',this.value)"><option value="lancada" selected>✓ Lançada</option><option value="pendente">Reabrir</option></select></article>`;
 }).join("");

 const monthlyPendingHtml=currentMonthly.filter(id=>!state.plans[id]?.[mk]).map(id=>{
   const c=COMPONENTS[id],title=c.tipo==="exp"?"Prática Experimental de Física":esc(c.nome);
   return `<article class="module-task-card ${c.tipo}"><div class="module-task-main"><div class="module-task-top"><span class="module-turma">${c.turma}</span></div><strong>${title}</strong><small>Planejamento mensal • ${monthNames[mk]||mk}</small></div><button class="module-state pending" onclick="togglePlan('${id}','${mk}')">○ Marcar lançado</button></article>`;
 }).join("");
 const monthlyDoneHtml=currentMonthly.filter(id=>!!state.plans[id]?.[mk]).map(id=>{
   const c=COMPONENTS[id],title=c.tipo==="exp"?"Prática Experimental de Física":esc(c.nome);
   return `<article class="module-task-card ${c.tipo}"><div class="module-task-main"><span class="module-turma">${c.turma}</span><strong>${title}</strong><small>${monthNames[mk]||mk}</small></div><button class="module-state done" onclick="togglePlan('${id}','${mk}')">✓ Lançado</button></article>`;
 }).join("");

 const hist=MONTHLY_PLANS.map(id=>{
   const c=COMPONENTS[id],months=Object.entries(state.plans[id]||{}).filter(([k])=>/^2026-(08|09|10|11|12)$/.test(k)).map(([k,v])=>`<span class="${v?"ok":"off"}">${monthNames[k]||k} ${v?"✓":"○"}</span>`).join("");
   return `<div class="history-plan-row ${c.tipo}"><div><strong>${c.turma}</strong><small>${esc(c.nome)}</small></div><div class="history-months">${months||"<span class='off'>Sem registros</span>"}</div></div>`;
 }).join("");

 document.getElementById("sec-planejamentos").innerHTML=`
 <div class="module-hero plans-module-hero"><div><span class="module-kicker">ORGANIZAÇÃO</span><h1>Planejamentos e ementas sem duplicidade.</h1><p>Projeto Integrador II tem uma única ementa para o semestre. Física e Experimental continuam com planejamento mensal.</p></div><div class="module-summary-grid"><div class="module-summary-card mat"><span>Ementas PI II</span><strong>${ementaPending}</strong><small>pendente(s) no semestre</small></div><div class="module-summary-card fis"><span>Planos mensais</span><strong>${monthlyPending}</strong><small>pendente(s) em ${monthNames[mk]||mk}</small></div><div class="module-summary-card exp"><span>Total</span><strong>${totalPending}</strong><small>obrigação(ões) a resolver</small></div></div></div>

 <section class="module-section"><div class="module-section-head"><div><span class="section-dot mat"></span><div><h2>Ementas • Projeto Integrador II</h2><p>1 ementa por turma • válida para os 6 meses do semestre</p></div></div><span>${ementaPending} a resolver</span></div><div class="module-card-grid">${ementaPendingHtml||`<div class="module-empty">Todas as ementas do Projeto Integrador II estão lançadas. ✓</div>`}</div></section>

 <section class="module-section"><div class="module-section-head"><div><span class="section-dot fis"></span><div><h2>Física e Experimental • ${monthNames[mk]||"mês atual"}</h2><p>Planejamentos mensais</p></div></div><div class="module-head-actions"><span>${monthlyPending} pendente(s)</span>${monthlyPending?`<button class="btn small" onclick="completeMonthlyPlans()">Concluir pendentes</button>`:""}</div></div><div class="module-card-grid">${monthlyPendingHtml||`<div class="module-empty">Planejamentos mensais em dia. ✓</div>`}</div></section>

 ${(monthlyDoneHtml||ementaDoneHtml)?`<details class="module-history"><summary>Concluídos nesta etapa</summary><div class="module-card-grid module-history-completed">${ementaDoneHtml}${monthlyDoneHtml}</div></details>`:""}
 <details class="module-history"><summary>Histórico de planejamentos mensais • Física e Experimental</summary><div class="module-history-body">${hist}</div></details>`;
}


function completeMonthlyPlans(){
 const mk=currentMonthKey();
 const pending=MONTHLY_PLANS.filter(id=>!state.plans[id]?.[mk]);
 if(!pending.length)return;
 if(!confirm(`Marcar ${pending.length} planejamento(s) mensal(is) como lançado(s)?`))return;
 pending.forEach(id=>{
   if(!state.plans[id])state.plans[id]={};
   state.plans[id][mk]=true;
   recordResolution(`plan:${id}:${mk}`,true,"Planejamentos",id,`${COMPONENTS[id].turma} • planejamento mensal`);
 });
 save();refreshAfterMutation("planejamentos");
}

function togglePlan(id,key){
 if(!state.plans[id])state.plans[id]={};
 const next=!state.plans[id][key];state.plans[id][key]=next;
 recordResolution(`plan:${id}:${key}`,next,"Planejamentos",id,`${COMPONENTS[id].turma} • planejamento`);
 save();refreshAfterMutation("planejamentos")
}
function setEmenta(id,v){
 const prev=state.ementas[id]||"nao-informado";
 state.ementas[id]=v;
 if(v==="lancada"&&prev!=="lancada")recordResolution(`ementa:${id}:2026-S2`,true,"Planejamentos",id,`${COMPONENTS[id].turma} • ementa`);
 else if(prev==="lancada"&&v!=="lancada")recordResolution(`ementa:${id}:2026-S2`,false,"Planejamentos",id,`${COMPONENTS[id].turma} • ementa`);
 save();refreshAfterMutation("planejamentos");
}

function renderNotas(){
 const t=currentTerm()||{n:3,start:"2026-08-03",end:"2026-10-14"};
 const pendingIds=GRADE_COMPONENTS.filter(id=>!state.grades[t.n]?.[id]),doneIds=GRADE_COMPONENTS.filter(id=>!!state.grades[t.n]?.[id]);
 const pending=pendingIds.length,done=doneIds.length,pct=GRADE_COMPONENTS.length?Math.round(done/GRADE_COMPONENTS.length*100):100;
 const card=id=>{const c=COMPONENTS[id],isDone=!!state.grades[t.n]?.[id];return `<article class="grade-status-card ${c.tipo}"><div class="grade-status-main"><div class="grade-card-top"><span class="module-turma">${c.turma}</span></div><strong>${esc(c.nome)}</strong><small>${c.turno} • ${t.n}º bimestre</small></div><button class="module-state ${isDone?"done":"pending"}" onclick="toggleGrade(${t.n},'${id}')">${isDone?"✓ Notas lançadas":"○ Marcar lançadas"}</button></article>`};
 document.getElementById("sec-notas").innerHTML=`
 <div class="module-hero notes-module-hero"><div><span class="module-kicker">FECHAMENTO</span><h1>Notas sem caça ao que faltou.</h1><p>${(()=>{const d=daysUntil(t.end);return pending&&d!==null&&d>=0?`<b class="notes-countdown ${d<=7?"urgent":""}">${d===0?"O bimestre fecha hoje":d===1?"Falta 1 dia para fechar o bimestre":`Faltam ${d} dias para fechar o bimestre`} (${br(t.end)}).</b> `:""})()}A lista mostra primeiro as turmas e componentes ainda pendentes.</p></div><div class="notes-progress-card"><div class="notes-progress-number"><strong>${done}/${GRADE_COMPONENTS.length}</strong><span>lançamentos concluídos</span></div><div class="notes-progress-track"><i style="width:${pct}%"></i></div><div class="notes-progress-footer"><span>${pct}% concluído</span><b>${pending} pendente(s)</b></div></div></div>
 <div class="notes-period-strip"><div><span>${t.n}º BIMESTRE</span><strong>${br(t.start)} — ${br(t.end)}</strong></div><div class="notes-period-actions"><div class="notes-legend"><span class="fis">Física</span><span class="mat">Matemática</span></div>${pending?`<button class="btn soft" onclick="completePendingGrades(${t.n})">✓ Marcar pendentes como lançadas</button>`:""}</div></div>
 <div class="grade-card-grid">${pendingIds.map(card).join("")||`<div class="module-empty">Todas as notas deste bimestre estão marcadas como lançadas. ✓</div>`}</div>
 ${doneIds.length?`<details class="module-history"><summary>Concluídas • ${doneIds.length}</summary><div class="grade-card-grid module-history-completed">${doneIds.map(card).join("")}</div></details>`:""}`;
}


function completePendingGrades(term){
 const ids=GRADE_COMPONENTS.filter(id=>!state.grades[term]?.[id]);
 if(!ids.length)return;
 if(!confirm(`Marcar ${ids.length} turma(s) pendente(s) como notas lançadas?`))return;
 if(!state.grades[term])state.grades[term]={};
 ids.forEach(id=>{
   state.grades[term][id]=true;
   recordResolution(`grade:${term}:${id}`,true,"Notas",id,`${COMPONENTS[id].turma} • notas`);
 });
 save();refreshAfterMutation("notas");
}

function toggleGrade(term,id){
 if(!state.grades[term]){state.grades[term]={};GRADE_COMPONENTS.forEach(x=>state.grades[term][x]=false)}
 const next=!state.grades[term][id];state.grades[term][id]=next;
 recordResolution(`grade:${term}:${id}`,next,"Notas",id,`${COMPONENTS[id].turma} • notas`);
 save();refreshAfterMutation("notas")
}


function timeToMin(t){
 const m=String(t).match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null;
}
function splitTimeRange(range){
 const parts=String(range).split(/[–-]/).map(x=>x.trim());
 return {start:timeToMin(parts[0]),end:timeToMin(parts[1])};
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportBackup(){download(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),`backup_sge_${iso(TODAY())}.json`)}
function importBackup(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=mergeState(makeDefault(),JSON.parse(r.result));save();renderAll();showToast("Backup importado com sucesso.");}catch(e){showToast("Não foi possível ler o backup.","warning")}};r.readAsText(f)}

function renderAll(){
 ensureAnalytics();
 renderNav();
 renderTopContext();
 renderSectionById(active);
 activateCurrentSection();
 setTimeout(hydrateMiniMarks,0);
 saveUIContext();
 recordDailySnapshot(false);
 localStorage.setItem(STORE,JSON.stringify(state));
 // V29: se nomes de alunos antigos foram descartados, grava e sincroniza a versão limpa.
 if(CALLS_PURGED){CALLS_PURGED=false;save();}
}
renderAll();
cloudBoot();
</script>
